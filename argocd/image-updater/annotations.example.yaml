# ArgoCD Application Annotations for Image Updater
# ==================================================
# Thêm các annotations này vào ArgoCD Application manifest để Image Updater
# tự động phát hiện image mới trên GAR và cập nhật tag trong gitops-cd.
#
# Ví dụ cho api-gateway service:

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-gateway
  namespace: argocd
  annotations:
    # Kích hoạt Image Updater cho app này
    argocd-image-updater.argoproj.io/image-list: >-
      api-gateway=asia-southeast1-docker.pkg.dev/lithe-paratext-506208-s5/delivery-repo/api-gateway

    # Strategy: dùng "latest" hoặc semver
    argocd-image-updater.argoproj.io/api-gateway.update-strategy: latest

    # Write back method: commit trực tiếp vào gitops-cd repo
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd-image-updater/git-creds
    argocd-image-updater.argoproj.io/write-back-target: "helmvalues:helm/environments/staging/values.yaml"

    # Map image tag field trong Helm values
    argocd-image-updater.argoproj.io/api-gateway.helm.image-tag: api-gateway.image.tag
    argocd-image-updater.argoproj.io/api-gateway.helm.image-name: api-gateway.image.repository

# ---
# Danh sách annotations cho tất cả services:
